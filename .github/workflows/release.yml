name: Release

# Tag-only: publishing is irreversible, so this never runs on PRs or branch pushes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC: npm Trusted Publishing auth + provenance attestation

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # registry-url is required so npm targets npmjs.org via OIDC (no NODE_AUTH_TOKEN).
          registry-url: https://registry.npmjs.org

      # npm OIDC Trusted Publishing needs npm >= 11.5.1 (Node 20 ships npm 10). Upgrade
      # BEFORE corepack so a corepack `npm` shim cannot shadow the upgraded npm.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # `corepack enable` (no args) also shims npm; enable Yarn only.
      - name: Enable Corepack (Yarn)
        run: corepack enable yarn

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      # OIDC Trusted Publishing (configured on npm for DiamondsLab/hardhat-diamonds):
      # no NPM_TOKEN — auth + provenance come from the OIDC id-token.
      # `prepack: tsc --build --force` rebuilds a clean dist; publishConfig.access is public.
      - name: Publish
        run: npm publish --provenance --access public
