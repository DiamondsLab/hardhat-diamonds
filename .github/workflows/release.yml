name: Release

# Tag-only: publishing is irreversible, so this never runs on PRs or branch pushes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC, required for npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      # No committed yarn.lock (developed in the monorepo workspace) -> plain install.
      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      # Publishes @diamondslab/hardhat-diamonds with provenance (OIDC via id-token: write).
      # `prepack: tsc --build --force` rebuilds a clean dist; publishConfig.access is public.
      #
      # Requires (provisioned by the Owner in M4-E3):
      #   - secrets.NPM_TOKEN (npm automation token), OR an npm Trusted Publisher (OIDC)
      #     linked to DiamondsLab/hardhat-diamonds (then NODE_AUTH_TOKEN can be dropped).
      # The first real run is the owner-approved v1.2.0 cut (M5-E3).
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
