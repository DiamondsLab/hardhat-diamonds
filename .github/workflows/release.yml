name: Release

# Tag-only: publishing is irreversible, so this never runs on PRs or branch pushes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC, required for npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No registry-url: it writes an .npmrc with always-auth + a token placeholder, which
      # forces token auth and blocks OIDC Trusted Publishing. OIDC needs only id-token: write.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      # No committed yarn.lock (developed in the monorepo workspace) -> plain install.
      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      # Publishes via npm OIDC Trusted Publishing (configured on npmjs.com for
      # DiamondsLab/hardhat-diamonds). No NPM_TOKEN needed — auth + provenance come from
      # the OIDC token (`id-token: write`). `prepack: tsc --build --force` rebuilds a clean
      # dist; publishConfig.access is public. First real run = the v1.2.0 cut (M5-E3).
      - name: Update npm (Trusted Publishing requires a recent npm CLI)
        run: npm install -g npm@latest

      - name: Publish
        run: npm publish --provenance --access public
